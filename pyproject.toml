[project]
name = "fix-the-mix-agent"
version = "0.1.0"
description = "Mixing and mastering feedback agent for electronic music: FastAPI + LiteLLM, built on the Project 1 starter"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "litellm>=1.50",
    "google-cloud-storage>=2.16",
    "numpy>=1.26",
    "scipy>=1.13",
    "librosa>=0.10.2",
    "matplotlib>=3.9",
    "mcp>=1.0",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
